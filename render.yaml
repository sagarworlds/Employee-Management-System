services:
  # .NET Backend API Service
  - type: web
    name: ems-api
    env: dotnet
    plan: free
    buildCommand: cd src/backend/EMS.API && dotnet publish -c Release -o out
    startCommand: cd src/backend/EMS.API && ./out/EMS.API
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:$PORT
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: ems-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://ems-ui.onrender.com

  # Angular Frontend Service
  - type: web
    name: ems-ui
    env: static
    plan: free
    buildCommand: cd src/frontend/ems-ui && npm install && npm run build
    staticPublishPath: src/frontend/ems-ui/dist/ems-ui/browser

# Database
databases:
  - name: ems-db
    plan: free
    databaseName: ems
    ipAllowList: []
